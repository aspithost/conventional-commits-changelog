name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
 
    - name: Install depencencies
      run: npm ci

    - name: Build
      run: npm run build
    
    - name: Lint
      run: npm run lint

    - name: Test
      run: npm run test
