name: CICD

on:
  push:
    branches: [main]

jobs:
  cicd:
    # uses: aspithost/actions/.github/workflows/node-cicd.yml@v3
    uses: aspithost/actions/.github/workflows/node-ci.yml@v3
    permissions:
      # contents: write
      # id-token: write
      contents: read
      pull-requests: write
    with:
      run-dependency-review: false
      run-sonar: true
      test-command: npm run test:cov:ci
      upload-coverage-report: true
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
